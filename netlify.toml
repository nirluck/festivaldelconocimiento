# =============================================================================
#  Netlify · Festival del Conocimiento
#  Sitio estático: no hay paso de compilación. Netlify publica /public tal cual.
# =============================================================================

[build]
  publish = "public"
  command = ""

# Cabeceras de seguridad razonables para un sitio institucional.
#
# camera=(self): la cámara solo la pide /puerta/, para leer los QR de los
# boletos. Se abre para el propio sitio y no solo para /puerta/* porque, si
# dos reglas ponen la misma cabecera, Netlify no documenta cuál gana: con
# camera=() aquí y camera=(self) abajo, la puerta podría quedarse sin cámara.
# Los iframes de otros sitios siguen sin poder usarla, y cada página que la
# pida tiene que pasar por el permiso del navegador.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=(self)"

# Las imágenes y tipografías no cambian: que el navegador las guarde.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El CSS y el JS sí cambian entre despliegues: se revalidan.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Las páginas internas no deben salir en buscadores.
[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/mi-actividad/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/actividad/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Boletos: cada página es de una persona, no de los buscadores.
[[headers]]
  for = "/boleto/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/mis-boletos/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Voluntariado: la bolsa de vacantes no sale en el menú ni en buscadores; se
# llega solo con la liga que se reparte a las instituciones invitadas.
# Ojo: NO va en robots.txt, porque un buscador que no puede leer la página
# tampoco ve este noindex y podría listar la dirección sola.
[[headers]]
  for = "/voluntariado/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# «Mis turnos» es de cada persona. El token del turno va tras el
# «#» y no llega al servidor, pero que tampoco se filtre en el Referer.
[[headers]]
  for = "/mis-turnos/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/b/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# La puerta: trae la lista de nombres de una actividad. Nada de buscadores.
[[headers]]
  for = "/puerta/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# =============================================================================
#  PROGRAMA PÚBLICO
#
#  En un sitio estático no hay un archivo por actividad, así que /programa/
#  y /programa/<slug>/ se sirven con la MISMA página y el JS decide qué pintar
#  leyendo location.pathname.
#
#  status = 200 es una reescritura, no un redireccionamiento: la dirección que
#  ve la persona sigue siendo /programa/taller-de-microscopia/, que es la que
#  se comparte y la que se imprime en un cartel.
#
#  Ojo al agregar archivos bajo /programa/: esta regla los tapa. Si algún día
#  hace falta, por ejemplo, /programa/programa.pdf, hay que excluirlo con una
#  regla anterior.
# =============================================================================
[[redirects]]
  from = "/programa/*"
  to   = "/programa/index.html"
  status = 200

# =============================================================================
#  BOLETOS
#
#  /b/<slug> es la página a la que apuntan los QR de cada actividad. Igual que
#  el programa: una sola página para todas, que lee el slug de la dirección.
#  Es corta a propósito, porque va impresa en carteles.
# =============================================================================
[[redirects]]
  from = "/b/*"
  to   = "/b/index.html"
  status = 200

[[redirects]]
  from = "/boletos"
  to   = "/mis-boletos/"
  status = 301

# Ruta corta para carteles y redes sociales.
[[redirects]]
  from = "/cartelera"
  to   = "/programa/"
  status = 301

# Rutas cómodas
[[redirects]]
  from = "/reporte"
  to   = "/mi-actividad/"
  status = 301

[[redirects]]
  from = "/login"
  to   = "/entrar/"
  status = 301

# Ruta corta para carteles y redes: la canónica es descriptiva pero larga.
[[redirects]]
  from = "/laboratorio"
  to   = "/laboratorio-arte-de-comunicar-ciencia/"
  status = 301

[[redirects]]
  from = "/laboratorio/*"
  to   = "/laboratorio-arte-de-comunicar-ciencia/"
  status = 301

# Rutas cortas del taller de cómic.
[[redirects]]
  from = "/comic"
  to   = "/taller-comic-difusion-cientifica/"
  status = 301

[[redirects]]
  from = "/fanzine"
  to   = "/taller-comic-difusion-cientifica/"
  status = 301

[[redirects]]
  from = "/convocatoria"
  to   = "/laboratorio-arte-de-comunicar-ciencia/"
  status = 302

[[redirects]]
  from = "/convocatorias"
  to   = "/laboratorio-arte-de-comunicar-ciencia/"
  status = 302

# La página estuvo colgando de /convocatoria/. Si alguien alcanzó a copiar esa
# liga, que no se rompa.
[[redirects]]
  from = "/convocatoria/arte-de-comunicar-ciencia"
  to   = "/laboratorio-arte-de-comunicar-ciencia/"
  status = 301

[[redirects]]
  from = "/convocatoria/arte-de-comunicar-ciencia/*"
  to   = "/laboratorio-arte-de-comunicar-ciencia/"
  status = 301
