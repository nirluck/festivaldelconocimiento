<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero · Festival del Conocimiento</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/icono-festcon.png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/cabecera.css">
<style>
  .resumen{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:26px}
  @media(min-width:760px){.resumen{grid-template-columns:repeat(4,1fr)}}
  .dato{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
        padding:18px 20px;box-shadow:var(--sombra)}
  .dato b{display:block;font-family:var(--f-disp);font-size:2rem;line-height:1;
          font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .dato span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
  .dato--rojo b{color:var(--rojo)} .dato--ambar b{color:var(--ambar)}
  .dato--verde b{color:var(--sem-verde)} .dato--total b{color:var(--turquesa-tx)}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .filtros select,.filtros input{width:auto;min-width:170px}
  .motivo{font-size:.82rem;color:var(--tx-3);display:block;margin-top:3px}
  .barrita{width:76px;height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:5px}
  .barrita i{display:block;height:100%;background:var(--turquesa);border-radius:99px}
</style>
</head>
<body>

<div data-cabecera></div>

<main class="hoja" id="pagina">
  <div class="cargando">Cargando el tablero…</div>
</main>

<footer class="pie">Festival del Conocimiento · Administración</footer>

<script type="module">
import { db, exigirSesion, explicar,
         fecha, fechaDia, fechaHora, hora, escapar } from '/assets/js/app.js';
import { montarCabecera } from '/assets/js/cabecera.js';

const $ = s => document.querySelector(s);
const pagina = $('#pagina');
let filas = [], esperado = 0;

(async function iniciar() {
  const yo = await exigirSesion('administrador');
  if (!yo) return;
  montarCabecera(yo);
  await cargar();
})();

async function cargar() {
  const { data, error } = await db
    .from('vista_actividades').select('*')
    .eq('archivada', false)
    .order('urgencia', { ascending: true })
    .order('titulo', { ascending: true });

  if (error) {
    pagina.innerHTML = `<div class="aviso aviso--mal">${escapar(explicar(error))}</div>`;
    return;
  }
  filas = data || [];
  esperado = filas.length ? filas[0].esperado : 0;
  pintar();
}

function pintar() {
  const n = c => filas.filter(f => f.color === c).length;

  pagina.innerHTML = `
    <div class="titulo">
      <p class="kicker">Administración</p>
      <h1>Tablero de actividades</h1>
      <p class="entrada">
        Ordenado por urgencia. Hoy lo esperado es <strong>${esperado}%</strong> de avance
        en cualquier actividad.
      </p>
    </div>

    <div class="resumen">
      <div class="dato dato--total"><b>${filas.length}</b><span>Actividades</span></div>
      <div class="dato dato--rojo"><b>${n('rojo')}</b><span>En riesgo</span></div>
      <div class="dato dato--ambar"><b>${n('ambar')}</b><span>Requieren atención</span></div>
      <div class="dato dato--verde"><b>${n('verde')}</b><span>En tiempo</span></div>
    </div>

    <div class="filtros">
      <select id="f-color">
        <option value="">Todos los colores</option>
        <option value="rojo">Solo en riesgo</option>
        <option value="ambar">Solo requieren atención</option>
        <option value="verde">Solo en tiempo</option>
      </select>
      <input type="text" id="f-buscar" placeholder="Buscar actividad o responsable">
      <button class="btn btn--chico btn--linea" id="csv" type="button">Descargar CSV</button>
    </div>

    <div id="tabla"></div>`;

  $('#f-color').addEventListener('change', tabla);
  $('#f-buscar').addEventListener('input', tabla);
  $('#csv').addEventListener('click', exportar);
  tabla();
}

function filtradas() {
  const c = $('#f-color').value;
  const q = $('#f-buscar').value.trim().toLowerCase();
  return filas.filter(f =>
    (!c || f.color === c) &&
    (!q || (f.titulo + ' ' + f.responsable + ' ' + f.correo).toLowerCase().includes(q))
  );
}

function tabla() {
  const d = filtradas();
  if (!d.length) {
    $('#tabla').innerHTML = `<div class="vacio"><h3>Nada que mostrar</h3>
      <p>Ninguna actividad coincide con los filtros.</p></div>`;
    return;
  }

  $('#tabla').innerHTML = `
    <div class="tabla-caja">
      <table>
        <thead>
          <tr>
            <th>Estado</th><th>Actividad</th><th>Responsable</th>
            <th class="num">Avance</th><th class="num">Días</th><th>Situación</th>
          </tr>
        </thead>
        <tbody>
          ${d.map(f => `
            <tr>
              <td>
                <span class="luces luces--${f.color}"><i></i><i></i><i></i></span>
                <span class="chip chip--${f.color}">${escapar(f.etiqueta)}</span>
              </td>
              <td>
                <strong>${escapar(f.titulo)}</strong>
                <span class="motivo">
                  <span class="eje">${escapar(f.eje || '—')}</span>
                  ${escapar(f.tipo || '')}${f.fecha ? ' · ' + escapar(fechaDia(f.fecha)) : ''}${f.hora_inicio ? ' · ' + escapar(hora(f.hora_inicio)) + ' h' : ''}
                  ${f.sede ? '· ' + escapar(f.sede) : ''}
                </span>
              </td>
              <td>
                ${escapar(f.responsable || '—')}
                <span class="motivo"><a href="mailto:${escapar(f.correo)}">${escapar(f.correo)}</a></span>
              </td>
              <td class="num">
                <strong>${f.avance}%</strong>
                <div class="barrita"><i style="width:${f.avance}%"></i></div>
              </td>
              <td class="num">${f.dias_sin}</td>
              <td>
                ${escapar(f.motivo)}
                ${f.problematica ? `<span class="motivo" style="color:var(--rojo)">Problemática: ${escapar(f.problematica)}</span>` : ''}
                ${f.necesidades ? `<span class="motivo">Necesita: ${escapar(f.necesidades)}</span>` : ''}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <p class="entrada" style="margin-top:14px;font-size:.86rem">
      ${d.length} de ${filas.length} actividades.
    </p>`;
}

/* ----------------------------------------------------------- exportar --- */
function exportar() {
  const cols = [
    ['Color','color'], ['Etiqueta','etiqueta'], ['Motivo','motivo'],
    ['Edición','anio'],
    ['Actividad','titulo'], ['Responsable','responsable'], ['Correo','correo'],
    ['Teléfono','telefono'], ['Eje','eje'], ['Tipo','tipo'], ['Sede','sede'],
    ['Fecha','fecha'], ['Hora','hora_inicio'], ['Hora fin','hora_fin'],
    ['Avance %','avance'], ['Esperado %','esperado'],
    ['Días sin reportar','dias_sin'], ['Reportes','envios'], ['Alerta declarada','alerta'],
    ['Avances','avances'], ['Necesidades','necesidades'], ['Problemática','problematica'],
    ['Siguiente paso','siguiente'], ['Requerimientos','requerimientos'],
    ['En el programa público','publica', v => v ? 'Sí' : 'No'], ['Dirección pública','slug'],
    ['Contactado','contactado'],
    ['Fecha contacto','seg_fecha'], ['Medio','seg_medio'],
    ['Notas seguimiento','seg_notas'], ['Creado','creado'], ['Actualizado','actualizado'],
  ];
  // Tercer elemento opcional: cómo se escribe el valor. Sin él, el booleano
  // «publica» saldría como «true» en una hoja de cálculo en español.
  const esc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const valor = (f, c) => (c[2] ? c[2](f[c[1]]) : f[c[1]]);
  const filasCsv = [cols.map(c => esc(c[0])).join(',')]
    .concat(filtradas().map(f => cols.map(c => esc(valor(f, c))).join(',')));

  // BOM para que Excel abra los acentos correctamente
  const blob = new Blob(['﻿' + filasCsv.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'festival-actividades-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
