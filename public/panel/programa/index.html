<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armar el programa · Festival del Conocimiento</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/icono-festcon.png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/cabecera.css">
<style>
  /* ==========================================================================
     ARMAR EL PROGRAMA · estilos propios de esta pantalla
     Van aquí y no en app.css siguiendo lo que ya hace /panel/: es una pantalla
     sola y su CSS no lo usa nadie más.
     ========================================================================== */

  .sub{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
  .sub a{
    font-family:var(--f-disp);font-weight:600;font-size:.88rem;text-decoration:none;
    color:var(--tx-2);padding:8px 16px;border-radius:100px;border:1.5px solid var(--line);
    background:var(--surface);
  }
  .sub a:hover{border-color:var(--turquesa);color:var(--tx)}
  .sub a[aria-current="page"]{background:var(--dark);border-color:var(--dark);color:#fff}

  .resumen{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:22px}
  @media(min-width:760px){.resumen{grid-template-columns:repeat(4,1fr)}}
  .dato{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
        padding:16px 18px;box-shadow:var(--sombra)}
  .dato b{display:block;font-family:var(--f-disp);font-size:1.85rem;line-height:1;
          font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .dato span{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
  .dato--pub b{color:var(--sem-verde)} .dato--band b{color:var(--ambar)}
  .dato--choq b{color:var(--rojo)}     .dato--dias b{color:var(--turquesa-tx)}

  /* ---- el tablero: bandeja fija + días desplazables --------------------- */
  .mesa{display:grid;gap:16px;align-items:start}
  @media(min-width:1000px){.mesa{grid-template-columns:286px minmax(0,1fr)}}

  .col{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    display:flex;flex-direction:column;min-height:120px;box-shadow:var(--sombra);
  }
  .col__tit{
    padding:13px 15px;border-bottom:1px solid var(--line-2);
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    position:sticky;top:0;background:var(--surface);border-radius:var(--r) var(--r) 0 0;z-index:2;
  }
  .col__tit h2{font-family:var(--f-disp);font-size:.95rem;font-weight:700;letter-spacing:-.01em}
  .col__tit small{font-size:.74rem;color:var(--tx-3);white-space:nowrap;
                  font-variant-numeric:tabular-nums}
  .col__cuerpo{padding:11px;display:flex;flex-direction:column;gap:9px;flex:1}

  /* La bandeja puede tener cuarenta actividades: se desplaza sola. */
  .col--bandeja .col__cuerpo{max-height:min(72vh,780px);overflow-y:auto}
  .col--bandeja{border-left:4px solid var(--ambar)}

  /* Los ocho días en una tira horizontal. Partirlos en renglones rompería la
     lectura de calendario, que es la razón de ser de esta pantalla. */
  .dias{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
  .dias .col{flex:0 0 252px}
  .col--hoy{border-color:var(--turquesa);box-shadow:0 0 0 2px rgba(16,171,196,.16)}
  .col--vacio .col__cuerpo{min-height:70px}

  /* Zona de caída activa mientras se arrastra */
  .col.soltar{border-color:var(--turquesa);background:var(--ice)}
  .col.soltar .col__tit{background:var(--ice)}

  /* ---- tarjeta de actividad --------------------------------------------- */
  .ac{
    border:1px solid var(--line);border-left:4px solid var(--eje,var(--turquesa));
    border-radius:var(--r-s);padding:11px 12px;background:var(--surface);
    display:flex;flex-direction:column;gap:7px;cursor:grab;
  }
  .ac:active{cursor:grabbing}
  .ac.arrastrando{opacity:.4}
  .ac__eti{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    font-family:var(--f-disp);font-size:.66rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
  .ac__eti b{color:var(--eje-tx,var(--turquesa-tx))}
  .ac__tit{font-family:var(--f-disp);font-size:.92rem;font-weight:700;
    line-height:1.3;letter-spacing:-.01em;color:var(--tx);text-wrap:pretty}
  .ac__meta{font-size:.78rem;color:var(--tx-3);display:flex;flex-direction:column;gap:2px}
  .ac__meta b{color:var(--tx-2);font-weight:600;font-variant-numeric:tabular-nums}
  .ac__acc{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
  .mini{
    font:inherit;font-family:var(--f-disp);font-size:.76rem;font-weight:600;
    padding:5px 11px;border-radius:100px;cursor:pointer;
    border:1.5px solid var(--line);background:var(--surface);color:var(--tx-2);
    text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  }
  .mini:hover{border-color:var(--dark);color:var(--tx)}
  .mini--pub{background:var(--dark);border-color:var(--dark);color:#fff}
  .mini--pub:hover{background:var(--darker);color:#fff}
  .mini--quita:hover{border-color:var(--rojo);color:var(--rojo)}
  .mini:disabled{opacity:.5;cursor:wait}

  /* Señal de empalme: la actividad comparte sede y hora con otra */
  .ac--choca{background:var(--rojo-bg)}
  .ac__choque{font-size:.74rem;color:#8C2418;font-weight:600;display:flex;gap:5px}

  /* Falta algo para poder publicarla */
  .ac__falta{font-size:.74rem;color:var(--ambar);font-weight:600}

  .col__nada{font-size:.8rem;color:var(--tx-3);text-align:center;padding:14px 8px;
    border:1.5px dashed var(--line);border-radius:var(--r-s)}

  /* ---- diálogo de programación ------------------------------------------ */
  dialog.dlg{
    border:0;border-radius:var(--r);padding:0;max-width:480px;width:calc(100% - 32px);
    box-shadow:0 24px 70px rgba(11,37,42,.32);color:var(--tx);
  }
  dialog.dlg::backdrop{background:rgba(11,37,42,.55);backdrop-filter:blur(3px)}
  .dlg__in{padding:24px}
  .dlg__tit{font-family:var(--f-disp);font-size:1.12rem;font-weight:700;
    letter-spacing:-.015em;margin-bottom:3px}
  .dlg__sub{font-size:.86rem;color:var(--tx-3);margin-bottom:20px}
  .dlg .campos{gap:14px}
  .dlg__propuso{font-size:.78rem;color:var(--naranja-tx);font-weight:600;margin-top:3px}
  .dlg__acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
  .dlg__aviso{margin-bottom:16px}
  .horas{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* ---- lista de empalmes ------------------------------------------------ */
  .choques{
    background:var(--rojo-bg);border-left:4px solid var(--rojo);color:#8C2418;
    border-radius:var(--r-s);padding:14px 18px;margin-bottom:20px;font-size:.9rem;
  }
  .choques h3{font-family:var(--f-disp);font-size:.95rem;margin-bottom:7px}
  .choques li{margin-top:5px;font-size:.86rem}
  .choques b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div data-cabecera></div>

<main class="hoja" id="pagina">
  <div class="cargando">Cargando el programa…</div>
</main>

<footer class="pie">Festival del Conocimiento · Administración</footer>

<script type="module">
/* ============================================================================
   ARMAR EL PROGRAMA · pantalla de la administración
   ----------------------------------------------------------------------------
   Dos mitades:

     BANDEJA   lo que los coordinadores registraron y todavía no entra al
               programa. Trae la fecha que ellos propusieron, como pista.
     LOS OCHO DÍAS   lo ya publicado, en su día y en orden de hora.

   «Agregar al programa» no es solo encender un interruptor: abre un diálogo
   donde la administración confirma día, hora y sede, porque una actividad sin
   sede en una cartelera no le sirve a nadie. Las tres son obligatorias para
   publicar.

   Los empalmes se AVISAN, no se bloquean: una sede puede tener dos salas y
   sostener dos actividades a la misma hora. Quien decide es la persona.

   Arrastrar es un acelerador de escritorio, no el mecanismo: todo se puede
   hacer con el botón «Programar», que es lo que funciona con el dedo. Mover
   algo ya publicado de un día a otro sí escribe directo —es reversible y se
   ve al instante—; sacar algo de la bandeja siempre pasa por el diálogo,
   porque ahí faltan datos que confirmar.
   ========================================================================== */

import { db, exigirSesion, explicar, catalogos, edicionActiva,
         fechaDia, hora, escapar } from '/assets/js/app.js';
import { montarCabecera } from '/assets/js/cabecera.js';
import { estiloEje } from '/assets/js/color.js';

const $ = s => document.querySelector(s);
const pagina = $('#pagina');

let EDICION = null;
let SEDES   = [];
let ACTS    = [];      // actividades no archivadas de la edición activa
let DIAS    = [];      // los días del festival, en ISO
let buscar  = '';

/* ------------------------------------------------------------- arranque --- */
(async function iniciar() {
  const yo = await exigirSesion('administrador');
  if (!yo) return;
  montarCabecera(yo);
  await cargar();
})();

async function cargar() {
  try {
    const [ed, cat] = await Promise.all([edicionActiva(), catalogos()]);
    EDICION = ed;
    SEDES   = cat.sedes;
    DIAS    = diasDe(ed);
    cat.ejes.forEach(e => EJES_COLOR[e.nombre] = e.color);
  } catch (e) {
    pagina.innerHTML = `<div class="aviso aviso--mal">${escapar(explicar(e))}</div>`;
    return;
  }

  const { data, error } = await db
    .from('vista_actividades')
    .select('id, titulo, slug, resumen, eje, tipo, sede, fecha, hora_inicio, hora_fin,' +
            'cupo, publica, responsable, correo, avance')
    .eq('edicion_id', EDICION.id)
    .eq('archivada', false)
    .order('fecha', { ascending: true, nullsFirst: true })
    .order('hora_inicio', { ascending: true, nullsFirst: true })
    .order('titulo', { ascending: true });

  if (error) {
    pagina.innerHTML = `<div class="aviso aviso--mal">${escapar(explicar(error))}</div>`;
    return;
  }
  ACTS = data || [];
  pintar();
}

/* --------------------------------------------------------------- fechas --- */
/* Con sus tres componentes, siempre: «new Date('2026-10-17')» es medianoche UTC
   y en Ensenada sale el 16. Trampa 16 del plan. */
function aFecha(isoTx) {
  const [a, m, d] = String(isoTx).slice(0, 10).split('-').map(Number);
  return (a && m && d) ? new Date(a, m - 1, d) : null;
}
const iso = f => [f.getFullYear(), String(f.getMonth() + 1).padStart(2, '0'),
                  String(f.getDate()).padStart(2, '0')].join('-');

function diasDe(ed) {
  const ini = aFecha(ed.fecha_inicio), fin = aFecha(ed.fecha_fin), out = [];
  if (!ini || !fin) return out;
  for (let f = new Date(ini), n = 0; f <= fin && n < 40; f.setDate(f.getDate() + 1), n++) {
    out.push(iso(new Date(f)));
  }
  return out;
}

function etiquetaDia(isoTx) {
  const f = aFecha(isoTx);
  if (!f) return isoTx;
  const s = f.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric' }).replace('.', '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------------------------------------------------------------- color --- */
/* El tono legible lo calcula color.js, el mismo módulo que usa la cartelera
   pública: así el eje se ve igual aquí y allá aunque alguien agregue uno nuevo
   desde la base. */
const EJES_COLOR = {};
const estilo = a => estiloEje(EJES_COLOR[a.eje]);

/* ================================================================ empalmes
   Dos actividades chocan si comparten sede y día y sus horarios se cruzan.
   Solo cuentan las publicadas: un borrador no ocupa una sede.

   Sin hora de término se asume una hora, que es lo que dura la mayoría de las
   charlas. Es una suposición, no un dato: por eso el aviso no bloquea nada.
   ====================================================================== */
const MIN_SIN_FIN = 60;

function minutos(hhmm) {
  if (!hhmm) return null;
  const [h, m] = String(hhmm).slice(0, 5).split(':').map(Number);
  return (Number.isFinite(h) && Number.isFinite(m)) ? h * 60 + m : null;
}

function tramo(a) {
  const i = minutos(a.hora_inicio);
  if (i === null) return null;
  const f = minutos(a.hora_fin);
  return [i, (f !== null && f > i) ? f : i + MIN_SIN_FIN];
}

/** Con quién choca «a», mirando contra la lista que se le pase. */
function choquesDe(a, contra) {
  const t = tramo(a);
  if (!t || !a.sede || !a.fecha) return [];
  return contra.filter(b =>
    b.id !== a.id && b.publica && b.sede === a.sede && b.fecha === a.fecha &&
    (() => { const u = tramo(b); return u && t[0] < u[1] && u[0] < t[1]; })()
  );
}

/** Todos los pares que se empalman, sin repetir. */
function todosLosChoques() {
  const pub = ACTS.filter(a => a.publica);
  const pares = [];
  pub.forEach((a, i) => choquesDe(a, pub.slice(i + 1)).forEach(b => pares.push([a, b])));
  return pares;
}

/* ---------------------------------------------------------------- pintar -- */
function faltaPara(a) {
  const f = [];
  if (!a.fecha)       f.push('día');
  if (!a.hora_inicio) f.push('hora');
  if (!a.sede || a.sede === 'Por definir') f.push('sede');
  return f;
}

function pintar() {
  const publicadas = ACTS.filter(a => a.publica);
  const bandeja    = ACTS.filter(a => !a.publica);
  const choques    = todosLosChoques();
  const conDia     = new Set(publicadas.map(a => a.fecha).filter(Boolean)).size;

  pagina.innerHTML = `
    <div class="sub">
      <a href="/panel/">Tablero</a>
      <a href="/panel/programa/" aria-current="page">Programa</a>
      <a href="/programa/" target="_blank" rel="noopener">Ver la cartelera ↗</a>
    </div>

    <div class="titulo">
      <p class="kicker">Administración</p>
      <h1>Armar el programa</h1>
      <p class="entrada">
        Arrastra una actividad al día que le toca, o usa «Programar».
        Para entrar al programa público necesita <strong>día, hora y sede</strong>:
        así la cartelera nunca muestra un hueco.
      </p>
    </div>

    <div class="resumen">
      <div class="dato dato--pub"><b>${publicadas.length}</b><span>En el programa</span></div>
      <div class="dato dato--band"><b>${bandeja.length}</b><span>En la bandeja</span></div>
      <div class="dato dato--dias"><b>${conDia}</b><span>de ${DIAS.length} días con programa</span></div>
      <div class="dato dato--choq"><b>${choques.length}</b><span>${choques.length === 1 ? 'Empalme' : 'Empalmes'}</span></div>
    </div>

    <div class="aviso" id="p-aviso" hidden></div>

    ${choques.length ? `
    <div class="choques">
      <h3>${choques.length === 1 ? 'Un empalme' : choques.length + ' empalmes'} de sede y horario</h3>
      <p>No impide publicar —una sede puede tener dos salas—, pero conviene revisarlo.</p>
      <ul>
        ${choques.map(([a, b]) => `<li>
          <b>${escapar(fechaDia(a.fecha))} · ${escapar(hora(a.hora_inicio))}</b> ·
          ${escapar(a.sede)}: «${escapar(a.titulo)}» y «${escapar(b.titulo)}»
        </li>`).join('')}
      </ul>
    </div>` : ''}

    <div class="filtros" style="margin-bottom:16px">
      <input type="text" id="f-buscar" value="${escapar(buscar)}"
             placeholder="Buscar en la bandeja por actividad o responsable" style="min-width:290px">
    </div>

    <div class="mesa">
      <div class="col col--bandeja" data-dia="bandeja">
        <div class="col__tit">
          <h2>Bandeja</h2>
          <small>${bandeja.length} sin publicar</small>
        </div>
        <div class="col__cuerpo" id="c-bandeja"></div>
      </div>

      <div class="dias" id="c-dias"></div>
    </div>

    ${dialogoHtml()}`;

  $('#f-buscar').addEventListener('input', e => {
    buscar = e.target.value;
    pintarBandeja();
  });

  pintarBandeja();
  pintarDias();
  conectarMesa();
  conectarDialogo();
}

function pintarBandeja() {
  const q = buscar.trim().toLowerCase();
  const d = ACTS.filter(a => !a.publica)
    .filter(a => !q || (a.titulo + ' ' + (a.responsable || '')).toLowerCase().includes(q));

  $('#c-bandeja').innerHTML = d.length
    ? d.map(a => tarjeta(a, false)).join('')
    : `<p class="col__nada">${q ? 'Nada coincide con la búsqueda.'
        : 'Todo lo registrado ya está en el programa.'}</p>`;
}

function pintarDias() {
  const hoy = iso(new Date());

  $('#c-dias').innerHTML = DIAS.map(d => {
    const delDia = ACTS.filter(a => a.publica && a.fecha === d);
    return `
      <div class="col${d === hoy ? ' col--hoy' : ''}${delDia.length ? '' : ' col--vacio'}" data-dia="${d}">
        <div class="col__tit">
          <h2>${escapar(etiquetaDia(d))}</h2>
          <small>${delDia.length || '—'}</small>
        </div>
        <div class="col__cuerpo">
          ${delDia.length
            ? delDia.map(a => tarjeta(a, true)).join('')
            : '<p class="col__nada">Sin actividades</p>'}
        </div>
      </div>`;
  }).join('');
}

function tarjeta(a, publicada) {
  const falta   = faltaPara(a);
  const choca   = publicada ? choquesDe(a, ACTS.filter(x => x.publica)) : [];
  const propone = !publicada && a.fecha;

  return `
  <article class="ac${choca.length ? ' ac--choca' : ''}" draggable="true"
           data-id="${a.id}" style="${estilo(a)}">
    <p class="ac__eti">
      <b>${escapar(a.eje || '—')}</b>
      ${a.tipo ? escapar(a.tipo) : ''}
    </p>
    <h3 class="ac__tit">${escapar(a.titulo)}</h3>

    <div class="ac__meta">
      ${publicada
        ? `<span><b>${escapar(hora(a.hora_inicio) || '—')}${a.hora_fin ? '–' + escapar(hora(a.hora_fin)) : ''}</b></span>
           <span>${escapar(a.sede || 'Sin sede')}</span>`
        : `${propone ? `<span>Propone: <b>${escapar(fechaDia(a.fecha))}</b>${a.hora_inicio ? ' ' + escapar(hora(a.hora_inicio)) : ''}</span>` : ''}
           ${a.sede && a.sede !== 'Por definir' ? `<span>${escapar(a.sede)}</span>` : ''}
           <span>${escapar(a.responsable || '—')}</span>`}
    </div>

    ${choca.length ? `<p class="ac__choque">⚠ Empalma con «${escapar(choca[0].titulo)}»</p>` : ''}
    ${!publicada && falta.length ? `<p class="ac__falta">Falta ${falta.join(', ')}</p>` : ''}

    <div class="ac__acc">
      ${publicada
        ? `<button class="mini" type="button" data-accion="editar" data-id="${a.id}">Cambiar</button>
           <button class="mini mini--quita" type="button" data-accion="quitar" data-id="${a.id}">Quitar</button>
           <a class="mini" href="/programa/${encodeURIComponent(a.slug)}/" target="_blank" rel="noopener">Ver ↗</a>`
        : `<button class="mini mini--pub" type="button" data-accion="programar" data-id="${a.id}">Programar</button>
           <a class="mini" href="/actividad/?id=${a.id}">Abrir</a>`}
    </div>
  </article>`;
}

/* ====================================================== arrastrar y soltar
   Todo por delegación, en el contenedor .mesa y una sola vez.

   La primera versión colgaba los escuchadores tarjeta por tarjeta después de
   cada repintado, y como pintarBandeja() y pintarDias() recorrían «.ac» sin
   distinguir de quién era cada tarjeta, las de la bandeja acababan con dos
   juegos: un clic en «Quitar» preguntaba dos veces. Delegando, los elementos se
   pueden volver a dibujar cuantas veces haga falta sin tocar los escuchadores.
   ====================================================================== */
let arrastrado = null;

function conectarMesa() {
  const mesa = document.querySelector('.mesa');
  if (!mesa) return;

  mesa.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-accion]');
    if (btn) accion(btn);
  });

  mesa.addEventListener('dragstart', (e) => {
    const el = e.target.closest('.ac');
    if (!el) return;
    arrastrado = el.dataset.id;
    el.classList.add('arrastrando');
    e.dataTransfer.effectAllowed = 'move';
    // Firefox no inicia el arrastre si no se escribe algo en dataTransfer.
    e.dataTransfer.setData('text/plain', el.dataset.id);
  });

  mesa.addEventListener('dragend', (e) => {
    const el = e.target.closest('.ac');
    if (el) el.classList.remove('arrastrando');
    arrastrado = null;
    mesa.querySelectorAll('.col.soltar').forEach(c => c.classList.remove('soltar'));
  });

  mesa.addEventListener('dragover', (e) => {
    const col = e.target.closest('.col[data-dia]');
    if (!col || !arrastrado) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('soltar');
  });

  mesa.addEventListener('dragleave', (e) => {
    const col = e.target.closest('.col[data-dia]');
    // «dragleave» también salta al pasar sobre un hijo: solo cuenta si el
    // puntero salió de verdad de la columna.
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('soltar');
  });

  mesa.addEventListener('drop', (e) => {
    const col = e.target.closest('.col[data-dia]');
    if (!col) return;
    e.preventDefault();
    col.classList.remove('soltar');
    const id = arrastrado || e.dataTransfer.getData('text/plain');
    if (id) soltar(id, col.dataset.dia);
  });
}

async function soltar(id, destino) {
  const a = ACTS.find(x => x.id === id);
  if (!a) return;

  // A la bandeja: despublicar. Es lo mismo que el botón «Quitar».
  if (destino === 'bandeja') {
    if (!a.publica) return;
    await quitar(a);
    return;
  }
  if (a.fecha === destino && a.publica) return;    // ya estaba ahí

  // Ya publicada y solo cambia de día: se escribe directo. Es reversible y el
  // resultado se ve al instante, así que pedir confirmación sería estorbo.
  if (a.publica && !faltaPara(a).length) {
    await guardar(a.id, { fecha: destino }, `«${a.titulo}» se movió al ${fechaDia(destino)}.`);
    return;
  }

  // Viene de la bandeja, o le falta algo: al diálogo, con el día ya puesto.
  abrirDialogo(a, destino);
}

/* ============================================================== diálogo === */
function dialogoHtml() {
  return `
  <dialog class="dlg" id="dlg">
    <form class="dlg__in" id="dlg-forma" novalidate>
      <p class="dlg__tit" id="dlg-tit">Programar actividad</p>
      <p class="dlg__sub" id="dlg-sub"></p>

      <div class="aviso dlg__aviso" id="dlg-aviso" hidden></div>

      <div class="campos">
        <div class="campo">
          <label for="dlg-fecha">Día</label>
          <select id="dlg-fecha" required></select>
          <span class="dlg__propuso" id="dlg-propuso" hidden></span>
          <span class="error-campo" id="dlg-e-fecha" hidden></span>
        </div>

        <div class="horas">
          <div class="campo">
            <label for="dlg-inicio">Empieza</label>
            <input type="time" id="dlg-inicio" required>
            <span class="error-campo" id="dlg-e-inicio" hidden></span>
          </div>
          <div class="campo">
            <label for="dlg-fin">Termina</label>
            <input type="time" id="dlg-fin">
          </div>
        </div>

        <div class="campo">
          <label for="dlg-sede">Sede</label>
          <select id="dlg-sede" required></select>
          <span class="error-campo" id="dlg-e-sede" hidden></span>
        </div>
      </div>

      <div class="dlg__acc">
        <button type="submit" class="btn btn--principal" id="dlg-ok">Publicar en el programa</button>
        <button type="button" class="btn btn--linea btn--chico" id="dlg-no">Cancelar</button>
      </div>
    </form>
  </dialog>`;
}

let editando = null;

function conectarDialogo() {
  const dlg = $('#dlg');
  $('#dlg-no').addEventListener('click', () => dlg.close());
  $('#dlg-forma').addEventListener('submit', enviarDialogo);

  // Revisar el empalme en vivo: que se entere antes de publicar, no después.
  ['#dlg-fecha', '#dlg-inicio', '#dlg-fin', '#dlg-sede'].forEach(s =>
    $(s).addEventListener('change', revisarChoque));
}

function abrirDialogo(a, diaSugerido) {
  editando = a;
  const yaEsta = a.publica;

  $('#dlg-tit').textContent = yaEsta ? 'Cambiar en el programa' : 'Programar actividad';
  $('#dlg-sub').textContent = a.titulo;
  $('#dlg-ok').textContent  = yaEsta ? 'Guardar cambios' : 'Publicar en el programa';
  $('#dlg-aviso').hidden = true;

  const selF = $('#dlg-fecha');
  selF.innerHTML = '<option value="">Elige el día</option>' +
    DIAS.map(d => `<option value="${d}">${escapar(etiquetaDia(d))} · ${escapar(fechaDia(d, true))}</option>`).join('');
  selF.value = diaSugerido || a.fecha || '';

  const selS = $('#dlg-sede');
  // «Por definir» se queda fuera a propósito: es justo lo que esta pantalla
  // tiene que resolver antes de publicar.
  selS.innerHTML = '<option value="">Elige la sede</option>' +
    SEDES.filter(s => s !== 'Por definir')
         .map(s => `<option value="${escapar(s)}">${escapar(s)}</option>`).join('');
  selS.value = (a.sede && a.sede !== 'Por definir') ? a.sede : '';

  $('#dlg-inicio').value = hora(a.hora_inicio) || '';
  $('#dlg-fin').value    = hora(a.hora_fin) || '';

  // Lo que propuso el coordinador, cuando no es lo que se va a publicar.
  const prop = $('#dlg-propuso');
  if (!yaEsta && a.fecha && a.fecha !== selF.value) {
    prop.textContent = 'El coordinador propuso el ' + fechaDia(a.fecha, true);
    prop.hidden = false;
  } else prop.hidden = true;

  ['fecha', 'inicio', 'sede'].forEach(c => marca(c, ''));
  revisarChoque();
  $('#dlg').showModal();
}

function marca(campo, msg) {
  const c = $('#dlg-' + campo), e = $('#dlg-e-' + campo);
  if (c) c.setAttribute('aria-invalid', msg ? 'true' : 'false');
  if (e) { e.textContent = msg || ''; e.hidden = !msg; }
}

function revisarChoque() {
  if (!editando) return;
  const caja = $('#dlg-aviso');
  const tentativa = {
    id: editando.id, sede: $('#dlg-sede').value,
    fecha: $('#dlg-fecha').value,
    hora_inicio: $('#dlg-inicio').value, hora_fin: $('#dlg-fin').value,
  };
  const ch = choquesDe(tentativa, ACTS.filter(a => a.publica));

  if (!ch.length) { caja.hidden = true; return; }
  caja.className = 'aviso aviso--mal dlg__aviso';
  caja.innerHTML = `<strong>${escapar(tentativa.sede)}</strong> ya tiene a esa hora
    ${ch.map(c => `«${escapar(c.titulo)}» (${escapar(hora(c.hora_inicio))}${c.hora_fin ? '–' + escapar(hora(c.hora_fin)) : ''})`).join(' y ')}.
    Puedes publicar igual si son salas distintas.`;
  caja.hidden = false;
}

async function enviarDialogo(ev) {
  ev.preventDefault();
  if (!editando) return;

  const fecha  = $('#dlg-fecha').value;
  const inicio = $('#dlg-inicio').value;
  const fin    = $('#dlg-fin').value;
  const sede   = $('#dlg-sede').value;

  let ok = true;
  if (!fecha)  { marca('fecha', 'Elige el día del festival.'); ok = false; } else marca('fecha', '');
  if (!inicio) { marca('inicio', 'Pon la hora de inicio.');    ok = false; } else marca('inicio', '');
  if (!sede)   { marca('sede', 'Elige la sede.');              ok = false; } else marca('sede', '');
  if (ok && fin && fin <= inicio) {
    marca('inicio', 'La hora de término tiene que ser posterior al inicio.'); ok = false;
  }
  if (!ok) return;

  const btn = $('#dlg-ok');
  btn.disabled = true;
  const antes = btn.textContent;
  btn.textContent = 'Guardando…';

  const nuevo = !editando.publica;
  const { error } = await db.from('actividades').update({
    fecha, hora_inicio: inicio, hora_fin: fin || null, sede, publica: true,
  }).eq('id', editando.id);

  btn.disabled = false; btn.textContent = antes;

  if (error) {
    const caja = $('#dlg-aviso');
    caja.className = 'aviso aviso--mal dlg__aviso';
    caja.textContent = explicar(error);
    caja.hidden = false;
    return;
  }

  const titulo = editando.titulo;
  $('#dlg').close();
  editando = null;
  await recargar(nuevo
    ? `«${titulo}» ya está en el programa público.`
    : `«${titulo}» se actualizó en el programa.`);
}

/* ============================================================== acciones == */
async function accion(btn) {
  const a = ACTS.find(x => x.id === btn.dataset.id);
  if (!a) return;

  if (btn.dataset.accion === 'programar' || btn.dataset.accion === 'editar') {
    abrirDialogo(a, null);
    return;
  }
  if (btn.dataset.accion === 'quitar') {
    if (!confirm(`¿Quitar «${a.titulo}» del programa público?\n\n`
               + 'Vuelve a la bandeja y deja de verse en la cartelera. '
               + 'Su día, hora y sede se conservan.')) return;
    btn.disabled = true;
    await quitar(a);
  }
}

async function quitar(a) {
  await guardar(a.id, { publica: false }, `«${a.titulo}» salió del programa público.`);
}

async function guardar(id, cambios, mensaje) {
  const { error } = await db.from('actividades').update(cambios).eq('id', id);
  if (error) { avisar('mal', explicar(error)); pintar(); return; }
  await recargar(mensaje);
}

async function recargar(mensaje) {
  await cargar();
  if (mensaje) avisar('ok', mensaje);
}

function avisar(tipo, texto) {
  const caja = $('#p-aviso');
  if (!caja) return;
  caja.className = 'aviso aviso--' + tipo;
  caja.textContent = texto;
  caja.hidden = false;
  caja.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
</body>
