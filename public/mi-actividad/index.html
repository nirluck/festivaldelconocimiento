<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis actividades · Festival del Conocimiento</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/icono-festcon.png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/cabecera.css">
</head>
<body>

<div data-cabecera></div>

<main class="hoja hoja--media" id="pagina">
  <div class="cargando">Cargando…</div>
</main>

<footer class="pie">
  ¿Necesitas ayuda? <a href="mailto:jperalta@ens.cnyn.unam.mx">jperalta@ens.cnyn.unam.mx</a>
</footer>


<script type="module">
import { db, exigirSesion, explicar, fechaDia, hora, escapar } from '/assets/js/app.js';
import { montarCabecera } from '/assets/js/cabecera.js';

const $ = s => document.querySelector(s);
const pagina = $('#pagina');
const params = new URLSearchParams(location.search);

let yo = null;

/* ========================================================================= */
(async function iniciar() {
  // Compatibilidad: antes el detalle vivía aquí, en /mi-actividad/?id=…
  // Ahora es el panel /actividad/. Si llega una liga vieja, se redirige.
  const id = params.get('id');
  if (id) { location.replace('/actividad/?id=' + encodeURIComponent(id)); return; }

  yo = await exigirSesion();
  if (!yo) return;
  montarCabecera(yo);

  await completarPendiente();
  await verLista();
})();

/**
 * Si se registró cuando el proyecto exigía confirmar el correo, la actividad
 * quedó guardada en el navegador. Ahora que sí hay sesión, se da de alta.
 */
async function completarPendiente() {
  const guardada = localStorage.getItem('fdc_actividad_pendiente');
  if (!guardada) return;
  try {
    const act = JSON.parse(guardada);
    // Los guardados antes de 07-nucleo.sql traen «actividad» y «dia», columnas
    // que ya no existen: insertarlos fallaría. Se descartan sin ruido.
    if (act && !('actividad' in act) && !('dia' in act)) {
      await db.from('actividades').insert({ ...act, responsable_id: yo.id });
    }
  } catch (e) { /* si falla, no bloqueamos la página */ }
  localStorage.removeItem('fdc_actividad_pendiente');
}

/* ============================== LISTA ==================================== */
async function verLista() {
  const { data, error } = await db
    .from('vista_actividades')
    .select('*')
    .order('creado', { ascending: false });

  if (error) {
    pagina.innerHTML = `<div class="aviso aviso--mal">${escapar(explicar(error))}</div>`;
    return;
  }

  let nueva = '';
  if (params.get('bienvenida')) {
    nueva = `<div class="aviso aviso--ok">
      <strong>Tu actividad quedó registrada y tu cuenta ya está lista.</strong><br>
      Esta es tu página: desde aquí abres cada actividad para completar sus datos
      y reportar cómo va, cuando quieras. Para volver, entra con tu correo y tu
      contraseña desde «Entrar».</div>`;
  } else if (params.get('nueva')) {
    nueva = `<div class="aviso aviso--ok">Tu actividad quedó registrada.</div>`;
  }

  if (!data.length) {
    pagina.innerHTML = `${nueva}
      <div class="titulo"><p class="kicker">Tu cuenta</p><h1>Todavía no tienes actividades</h1></div>
      <div class="vacio">
        <h3>Aquí aparecerán las actividades que registres</h3>
        <p>Da de alta la primera y desde aquí podrás completarla y reportar cómo va.</p>
        <a class="btn btn--principal" href="/registro/">Registrar una actividad</a>
      </div>`;
    return;
  }

  pagina.innerHTML = `${nueva}
    <div class="titulo">
      <p class="kicker">Tu cuenta</p>
      <h1>Mis actividades</h1>
      <p class="entrada">Da clic en cualquiera para completar sus datos y reportar cómo va.</p>
      <p style="margin-top:18px">
        <a class="btn btn--principal" href="/registro/">Registrar otra actividad</a>
      </p>
    </div>
    <div class="acts">${data.map(tarjeta).join('')}</div>`;
}

function tarjeta(a) {
  return `
    <article class="act">
      <div class="act__top">
        <h3>${escapar(a.titulo)}</h3>
        <span class="chip chip--${a.color}">${escapar(a.etiqueta)}</span>
      </div>
      <div class="act__meta">
        <span class="eje">${escapar(a.eje || 'Sin eje')}</span>
        <span>${escapar(a.tipo || '')}</span>
        ${a.fecha ? `<span>· ${escapar(fechaDia(a.fecha))}</span>` : ''}
        ${a.hora_inicio ? `<span>· ${escapar(hora(a.hora_inicio))} h</span>` : ''}
      </div>
      <div>
        <div class="act__barra"><i style="width:${a.avance}%"></i></div>
      </div>
      <div class="act__pie">
        <span>${a.avance}% de avance${a.envios ? ` · ${a.envios} reporte${a.envios === 1 ? '' : 's'}` : ' · sin reportes'}</span>
        <a class="btn btn--chico btn--linea" href="/actividad/?id=${a.id}">Abrir</a>
      </div>
    </article>`;
}
</script>
</body>
</html>
